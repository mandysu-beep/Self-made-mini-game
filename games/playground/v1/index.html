    this.bars={};this.notes.forEach(n=>{const b=Math.floor((n.tn-this.lead)/(4*this.bd)),l=n.n[0];(this.bars[b]=this.bars[b]||[]).push(l)});
    const CH={C:'CEG',F:'FAC',G:'GBD'},RT={C:130.8,F:174.6,G:196};for(const b in this.bars){let best='C',bs=-1;for(const c in CH){const sc=this.bars[b].filter(x=>CH[c].includes(x)).length;if(sc>bs){bs=sc;best=c}}this.bars[b]=RT[best]}this.RT=RT}
  beat(i,dl){const k=i%4,b=Math.floor((i*this.bd-this.lead)/(4*this.bd)),root=this.bars[Math.max(0,b)]||130.8;if(k===0||k===2)AM.kick(dl);if(k===1||k===3)AM.snare(dl);AM.hat(dl);AM.hat(dl+this.bd/2,.06);if(k===0)AM.bass(root,dl,this.bd*1.8);if(k===2)AM.bass(root*1.5,dl,this.bd*1.8)}
  replay(dl){this.auto=true;this.idle=false;this.tm=-(dl||1.8);this.nb=0;this.mi=0;this.done=0;this.combo=0;this.notes.forEach(n=>n.st=0);FX.clear()}
  update(dt){if(this.idle){for(const d of this.ts){d.b*=.9;d.f=Math.max(0,d.f-dt)}return}
    this.tm+=dt;const t=this.tm,ah=.3,au=this.auto;
    while(this.nb*this.bd<t+ah){this.beat(this.nb,Math.max(0,this.nb*this.bd-t));this.nb++}
    while(this.mi<this.notes.length&&this.notes[this.mi].tn<t+ah){const n=this.notes[this.mi];AM.note(n.n,this.bd*.9*this.mel[this.mi].du,Math.max(0,n.tn-t),au?.5:.14);this.mi++}
    for(const d of this.ts){d.b*=.9;d.f=Math.max(0,d.f-dt)}
    const dr=this.dr;
    for(const n of this.notes){if(n.st)continue;const dtm=Math.abs(n.tn-t),d=n.t;
      if(au){if(t>=n.tn){n.st=1;this.done++;d.b=1;d.f=.8;FX.burst(d.x,d.y,14);FX.ring(d.x,d.y,true);if(this.done%4===0)FX.conf(14)}continue}
      if(dtm<=.55&&near(d.x,d.y,dr*.9)){n.st=1;this.done++;this.caught++;this.combo++;const perfect=dtm<.2;d.b=1;d.f=.8;
        AM.drum();AM.tone(CONFIG.notes[n.n],.7,'triangle',.6);AM.tone(CONFIG.notes[n.n]*2,.35,'sine',.18);
        FX.burst(d.x,d.y,perfect?26:12);FX.ring(d.x,d.y,perfect);if(perfect){AM.cymbal();AM.sparkle()}
        if(this.combo%3===0){AM.fanfare();FX.conf(40);FX.burst(GC.W/2,GC.H*.4,30,1)}}
      else if(t>n.tn+.55){n.st=2;this.done++;this.combo=0;FX.ring(d.x,d.y)}}
    if(t>this.end){if(au){this.auto=false;this.idle=true}else if(GC.state==='play'){GC.win();this.replay(2.2)}}}
  pos(n){const t=n.t,f=Math.min(1.2,(n.tn-this.tm)/this.fall),W=GC.W,H=GC.H,sx=t.dy===1?t.x:t.dy===-1?t.x:t.dx===1?-60:W+60,sy=t.dy===1?CONFIG.hud+10:t.dy===-1?H+60:t.y;return[t.x+(sx-t.x)*f,t.y+(sy-t.y)*f,f]}
  draw(g){const W=GC.W,H=GC.H,ph=((this.tm/this.bd)%1+1)%1,pul=Math.max(0,1-ph*3)*.08;g.strokeStyle='#ff9f1c';g.lineWidth=7;g.beginPath();
    for(const t of this.ts){if(t.dy){g.moveTo(0,t.y);g.lineTo(W,t.y)}else{g.moveTo(t.x,CONFIG.hud);g.lineTo(t.x,H)}}g.stroke();
    for(const t of this.ts)pad(t.x,t.y,this.dr,t.hue,t.f>0?'😝':'🥁',t.b+pul,false,false);
    let first=true;for(const n of this.notes){if(n.st)continue;const p=this.pos(n);if(p[2]>1||p[2]<-.3)continue;pad(p[0],p[1],this.dr*.7,n.t.hue,'🎵',0,false,first);first=false}
    bar(g,this.done/this.notes.length);if(this.combo>=3){g.fillStyle='#ff6a00';g.font='900 34px sans-serif';g.textAlign='center';g.fillText('🔥 '+this.combo,W/2,CONFIG.hud+64)}}}
/* ================= 音樂 6-7：動物音樂會（發光動物的順序＝歌曲旋律） ================= */
class Zoo{
  init(L){this.L=L;this.mel=parseSong(CONFIG.songs[L.song]);this.cum=[];let cc=0;this.mel.forEach(m=>{this.cum.push(cc);cc+=m.du*.6});this.rp=null;const ps=this.mel.map(n=>n.p);this.lo=Math.min(...ps);this.hi=Math.max(...ps);this.an=['🐶','🐱','🐮','🐸'].slice(0,L.n).map((e,i)=>({e,i,j:0}));this.k=0;this.cd=0;this.tg=this.which(0)}
  which(i){return Math.min(this.L.n-1,Math.floor((this.mel[i].p-this.lo)/(this.hi-this.lo+1)*this.L.n))}
  replay(dl){this.rp={t:-(dl||1.8),i:0};this.k=0}
  update(dt){const W=GC.W,n=this.an.length,r=this.r=Math.max(40,Math.min(cmRaw()*.5,W/(n*2.4)));this.cd-=dt;
    this.an.forEach((a,i)=>{a.x=W*(i+1)/(n+1);a.y=(CONFIG.hud+GC.H)/2;a.j*=.9});
    if(this.rp){const rp=this.rp;rp.t+=dt;while(rp.i<this.mel.length&&rp.t>=this.cum[rp.i]){const m=this.mel[rp.i],a=this.an[this.which(rp.i)];this.tg=this.which(rp.i);a.j=1;AM.note(m.n,.7,0,.55);FX.burst(a.x,a.y,14);rp.i++;this.k=rp.i}
      if(rp.i>=this.mel.length&&rp.t>this.cum[this.mel.length-1]+1)this.rp=null;return}
    if(this.k>=this.mel.length)return;
    const a=this.an[this.tg];if(this.cd<=0&&near(a.x,a.y,r)){a.j=1;this.cd=.7;AM.note(this.mel[this.k].n,.9,0,.6);AM.cry(a.i);FX.burst(a.x,a.y,18);this.k++;
      if(this.k>=this.mel.length){if(GC.state==='play'){GC.win();this.replay(2.2)}return}this.tg=this.which(this.k)}}
  draw(g){this.an.forEach((a,i)=>{const on=i===this.tg;pad(a.x,a.y-a.j*40,this.r,[350,40,130,210][i],a.e,0,!on,on)});bar(g,this.k/this.mel.length)}}
const HANDLERS={paint:Paint,snake:Snake,maze:Maze,chase:Chase,taiko:Taiko,zoo:Zoo};
const isStatic=L=>L.t==='maze'||L.t==='zoo'||(L.t==='paint'&&!L.move);
/* ================= GameController ================= */
const GC={W:0,H:0,T:0,P:{x:-999,y:-999,in:false},g:null,state:'home',th:0,idx:-1,h:null,out:'#4a3a2a',base:'rgba(255,255,255,.75)',dk:false,
  init(){Store.load();Object.assign(S,Store.d.set||{});this.cv=$('#c');this.g=this.cv.getContext('2d');this.theme();UI.build();addEventListener('resize',()=>this.fit());this.fit();
    addEventListener('pointermove',e=>{const p=this.P;p.x=e.clientX;p.y=e.clientY;p.in=true;if(!AM.ok()&&S.sound&&e.timeStamp-(this.lu||0)>1500){this.lu=e.timeStamp;AM.unlock()}},{passive:true});
    document.addEventListener('pointerleave',()=>{this.P.in=false});['pointerdown','keydown','touchstart','click'].forEach(e=>addEventListener(e,()=>AM.unlock(),{passive:true}));
    UI.show('home');requestAnimationFrame(t=>this.loop(t))},
  fit(){const d=devicePixelRatio||1;this.W=innerWidth;this.H=innerHeight;this.cv.width=this.W*d;this.cv.height=this.H*d;this.g.setTransform(d,0,0,d,0,0);UI.layout();if(this.h&&UI.cur==='play'&&this.state==='play')this.h.init(this.lvl())},
  theme(){const o=CONFIG.opts.bg[S.bg];this.dk=!!o.dk;document.body.style.background=o.v;document.body.classList.toggle('dk',this.dk);this.out=this.dk?'#fff':'#4a3a2a';this.base=S.bc?BASES[S.bc]:(this.dk?'rgba(255,255,255,.12)':'rgba(255,255,255,.75)')},
  lvl(){return CONFIG.levels[CONFIG.themes[this.th].id][this.idx]},
  start(th,i){this.th=th;this.idx=i;const L=this.lvl();this.h=new HANDLERS[L.t]();FX.clear();this.state='play';UI.show('play');this.h.init(L);Voice.say(CONFIG.say[L.t])},
  win(){if(this.state!=='play')return;this.state='win';Store.d.done[this.th+'-'+this.idx]=1;Store.save();AM.chime();FX.celebrate();Voice.praise();UI.showWin()},
  loop(ms){const T=ms/1000,dt=Math.min(.05,T-this.T);this.T=T;const g=this.g;g.clearRect(0,0,this.W,this.H);
    if(this.h&&UI.cur==='play'){if(!UI.dr)this.h.update(dt);this.h.draw(g)}FX.update(dt);FX.draw(g);
    if(this.P.in&&UI.cur==='play'&&!(this.h instanceof Maze)&&!(this.h instanceof Snake)){const P=this.P,fxc=this.h instanceof Paint&&S.pc<8,h=fxc?HUES[S.pc]:(T*140)%360,r=cr(),gr=g.createRadialGradient(P.x-r*.3,P.y-r*.3,3,P.x,P.y,r);gr.addColorStop(0,'#fff');gr.addColorStop(.35,`hsl(${h},95%,65%)`);gr.addColorStop(1,`hsl(${fxc?h:(h+60)%360},95%,${fxc?52:50}%)`);g.fillStyle=gr;g.beginPath();g.arc(P.x,P.y,r,0,6.2832);g.fill();g.lineWidth=8;g.strokeStyle='#000';g.stroke();g.lineWidth=4;g.strokeStyle='#fff';g.stroke()}
    $('#mu').hidden=AM.ok();$('#pal').hidden=!(UI.cur==='play'&&this.h instanceof Paint&&this.h.ph==='paint');requestAnimationFrame(t=>this.loop(t))}};
/* ================= UI：全程凝視停留觸發 ================= */
const UI={cur:'home',dr:false,
  dwell(el,fn,ms){ms=ms||900;let t;const go=()=>{clearTimeout(t);el.classList.remove('dwell');AM.unlock();fn()};
    el.addEventListener('pointerenter',()=>{el.classList.add('dwell');el.style.setProperty('--ms',ms+'ms');t=setTimeout(go,ms)});el.addEventListener('pointerleave',()=>{clearTimeout(t);el.classList.remove('dwell')});el.addEventListener('click',go)},
  show(n){this.cur=n;this.drawer(false);$('#home').hidden=n!=='home';$('#lvls').hidden=n!=='lvls';$('#win').hidden=!(n==='play'&&GC.state==='win');$('#bH').hidden=n==='home';
    if(n==='home'){GC.h=null;FX.clear()}if(n==='lvls')this.buildLvls()},
  pal(){[...$('#pal').children].forEach((b,i)=>b.classList.toggle('on',i===S.pc))},
  up(){GC.state='home';GC.h=null;FX.clear();this.show('lvls')},
  build(){const h=$('#home');CONFIG.themes.forEach((t,i)=>{const b=document.createElement('button');b.className='dw card';b.style.setProperty('--c',t.c);b.innerHTML=`<i>${t.icon}</i><b>${t.name}</b>`;h.appendChild(b);this.dwell(b,()=>{GC.th=i;this.show('lvls')},1000)});
    this.dwell($('#bH'),()=>{this.cur==='play'?this.up():this.show('home')});
    const pl=$('#pal');[...HUES.map(h=>`hsl(${h},90%,58%)`),'conic-gradient(#f33,#fd0,#3d3,#0cf,#36f,#f3c,#f33)'].forEach((c,i)=>{const b=document.createElement('button');b.className='dw';b.style.background=c;b.setAttribute('aria-label','顏色');pl.appendChild(b);this.dwell(b,()=>{S.pc=i;Store.save();AM.bubble();this.pal()},500)});this.pal();this.dwell($('#bS'),()=>this.drawer(!this.dr),800);
    const d=$('#drawer');d.addEventListener('pointerleave',()=>{this.dt=setTimeout(()=>this.drawer(false),3500)});d.addEventListener('pointerenter',()=>clearTimeout(this.dt))},
  layout(){const W=GC.W,H=GC.H,por=W<H,g=$('#grid');if(!g)return;g.style.gridTemplateColumns=`repeat(${por?2:5},var(--d))`;
    const d=por?Math.min((W-60)/2,(H-72-90)/5-14):Math.min((W-90)/5,(H-72-110)/2-14);g.style.setProperty('--d',Math.max(70,Math.floor(d))+'px')},
  buildLvls(){const th=GC.th,t=CONFIG.themes[th];$('#lt').textContent=t.icon+' '+t.name;const g=$('#grid');g.innerHTML='';this.layout();
    CONFIG.levels[t.id].forEach((L,i)=>{const b=document.createElement('button');b.className='dw lv';b.style.setProperty('--c',t.c);b.innerHTML=`<em>${i+1}</em><i>${L.i}</i><span>${L.d}</span>${Store.d.done[th+'-'+i]?'<s>⭐</s>':''}`;g.appendChild(b);this.dwell(b,()=>GC.start(th,i),1000)})},
  drawer(open){this.dr=open;const d=$('#drawer');d.classList.toggle('open',open);if(open)this.buildSet();clearTimeout(this.dt)},
  buildSet(){const d=$('#drawer'),L=GC.h&&GC.lvl(),st=L&&isStatic(L),O=CONFIG.opts,
    row=(t,k,ls,off)=>`<div class="dr"><b>${t}</b><div class="op">${ls.map((l,i)=>`<button class="dw ${S[k]===i?'on':''} ${off?'off':''}" data-k="${k}" data-i="${i}">${l}</button>`).join('')}</div></div>`;
    d.innerHTML=`<div class="dh"><span>設定</span><button class="dw hb" id="dx">✕</button></div>`+row('筆觸大小','cur',O.cur.map(o=>o[0]))+row('物件大小','cm',O.cm.map(c=>c+'公分'))+row('移動速度','spd',O.spd.map(o=>o[0]),st)+
      `<div class="dr"><b>背景顏色</b><div class="op">${O.bg.map((o,i)=>`<button class="dw sw ${S.bg===i?'on':''}" style="background:${o.v}" data-k="bg" data-i="${i}"></button>`).join('')}</div></div>`+
      `<div class="dr"><b>形狀底色</b><div class="op">${BASEOPT.map((c,i)=>`<button class="dw sw ${S.bc===i?'on':''}" style="background:${c}" data-k="bc" data-i="${i}"></button>`).join('')}</div></div>`+
      `<div class="dr"><b>語音聲音</b><div class="op"><button class="dw" id="vc">${Voice.vs.length?'換聲音 '+(S.vi%Voice.vs.length+1)+'/'+Voice.vs.length:'無中文語音'}</button><button class="dw ${S.sound?'on':''}" id="sn">${S.sound?'音效 開':'音效 關'}</button></div></div>`;
    d.querySelectorAll('[data-k]').forEach(b=>this.dwell(b,()=>{S[b.dataset.k]=+b.dataset.i;Store.save();GC.theme();this.buildSet();if(GC.h&&GC.state==='play'&&['cm','spd'].includes(b.dataset.k))GC.h.init(GC.lvl())},800));
    this.dwell($('#dx'),()=>this.drawer(false),800);this.dwell($('#vc'),()=>{if(!Voice.vs.length)return;S.vi=(S.vi+1)%Voice.vs.length;Store.save();this.buildSet();Voice.say('你好，我是你的小幫手')},800);
    this.dwell($('#sn'),()=>{S.sound=!S.sound;Store.save();if(!S.sound&&window.speechSynthesis)speechSynthesis.cancel();this.buildSet()},800)},
  showWin(){const w=$('#win'),last=GC.idx>=9;w.innerHTML=(last?'':'<button class="dw" id="wn">➡️</button>')+'<button class="dw" id="wr">🔄</button>'+(GC.h&&GC.h.replay?'<button class="dw" id="wp">🎵</button>':'')+'<button class="dw" id="wm">🏠</button>';w.hidden=false;
    if(GC.h&&GC.h.replay)this.dwell($('#wp'),()=>GC.h.replay(1),1000);
    if(!last)this.dwell($('#wn'),()=>GC.start(GC.th,GC.idx+1),1200);this.dwell($('#wr'),()=>GC.start(GC.th,GC.idx),1200);this.dwell($('#wm'),()=>this.up(),1200)}};
GC.init();
