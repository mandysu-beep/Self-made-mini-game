<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site

     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>料理遊戲</title>
<style>
:root{
  --ink:#3a2a1a; --card:#fff;
  --accent:#ff8f3c; --accent2:#e05a3a; --ok:#2fbf71; --sun:#ffd23f;
  --target-scale:1;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{height:100%; margin:0;}
body{
  font-family:"jf-openhuninn","Yuanti TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color:var(--ink); background:#fff7ec; overflow:hidden;
}

/* ---------- Header ---------- */
header{
  position:fixed; top:0; left:0; right:0; z-index:60;
  display:flex; align-items:center; gap:10px; padding:10px 14px;
  background:rgba(255,255,255,.88); backdrop-filter:blur(8px);
  border-bottom:3px solid rgba(58,42,26,.08);
}
header h1{font-size:20px; margin:0; letter-spacing:2px; font-weight:900;}
header .lvl{margin-left:6px; font-size:13px; font-weight:800; color:#fff; background:var(--accent2); padding:4px 12px; border-radius:999px;}
header .spacer{flex:1;}
.iconbtn{
  width:46px; height:46px; border-radius:16px; border:3px solid var(--ink);
  background:#fff; font-size:20px; cursor:pointer; box-shadow:0 3px 0 var(--ink); transition:transform .08s;
}
.iconbtn:active{transform:translateY(3px); box-shadow:none;}

/* ---------- Stage & backgrounds ---------- */
#stage{position:fixed; inset:0; padding-top:66px; overflow:hidden;}
#bg{position:absolute; inset:0; z-index:0; transition:background .4s;}
#bg.simple{background:linear-gradient(#fff3df 0 100%);}
#bg.rich{background:
  linear-gradient(rgba(255,240,214,.4), rgba(255,240,214,.4)),
  repeating-linear-gradient(90deg,#ffe6c2 0 70px,#ffedd4 70px 140px);}
#bg.contrast{background:#191308;}
#bg .deco{position:absolute; opacity:0; transition:opacity .4s; font-size:60px;}
#bg.rich .deco{opacity:1;}
.shelf{top:90px; left:0; right:0; text-align:center; letter-spacing:44px;}
.shelf2{top:90px; display:none;}
.window{top:170px; right:6%; width:150px; height:120px; background:#bde9ff; border:8px solid #d8a25e; border-radius:14px;}
.window::before{content:"☀️"; position:absolute; font-size:36px; top:8px; left:12px;}
#bg.contrast .glow{position:absolute; inset:0; background:radial-gradient(circle at 50% 60%, rgba(255,220,120,.14), transparent 60%); opacity:1;}

/* ---------- Steps ---------- */
#steps{
  position:fixed; z-index:55; left:50%; transform:translateX(-50%); top:76px;
  display:flex; gap:8px; background:rgba(255,255,255,.9);
  border:3px solid var(--ink); border-radius:999px; padding:6px 12px;
  box-shadow:0 4px 0 var(--ink);
}
#steps span{
  width:44px; height:44px; border-radius:50%; display:grid; place-items:center;
  font-size:22px; background:#f2e6d4; opacity:.5; transition:.25s;
}
#steps span.on{opacity:1; background:var(--sun); transform:scale(1.15); box-shadow:0 0 0 3px var(--ink) inset;}
#steps span.done{opacity:1; background:#c9f3c9;}

/* ---------- Banner ---------- */
#banner{
  position:fixed; z-index:55; left:50%; transform:translateX(-50%); top:136px;
  background:var(--card); border:4px solid var(--ink); border-radius:24px;
  padding:10px 24px; font-size:20px; font-weight:900; letter-spacing:1px;
  box-shadow:0 5px 0 var(--ink); max-width:88vw; text-align:center;
}
#banner b{color:var(--accent2);}

/* ---------- Grid & target ---------- */
#grid{position:absolute; z-index:20; display:grid; gap:10px;}
.gcell{
  border:4px dashed rgba(58,42,26,.28); border-radius:22px;
  display:grid; place-items:center; position:relative;
  background:rgba(255,255,255,.28);
}
#bg.contrast ~ #grid .gcell{border-color:rgba(255,226,74,.5); background:rgba(255,255,255,.06);}
.gcell.hastarget{cursor:pointer; background:rgba(255,255,255,.7); border-style:solid; border-color:var(--ink);
  box-shadow:0 6px 0 var(--ink); transition:transform .08s;}
.gcell.hastarget:active{transform:translateY(5px); box-shadow:none;}
.target{
  line-height:1; pointer-events:none;
  animation:tpulse 1.5s infinite;
  filter:drop-shadow(0 6px 4px rgba(0,0,0,.2));
}
@keyframes tpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.flyer{position:fixed; z-index:80; pointer-events:none; line-height:1;
  transition:left .55s cubic-bezier(.35,-0.2,.6,1.2), top .55s cubic-bezier(.35,-0.2,.6,1.2), font-size .55s;}

/* ---------- Stove / pan ---------- */
#stove{
  position:absolute; z-index:15; left:50%; transform:translateX(-50%); bottom:0;
  width:min(560px, 92vw); height:185px; pointer-events:none;
}
#stoveBase{
  position:absolute; bottom:0; left:0; right:0; height:74px;
  background:#8a5a33; border:5px solid var(--ink); border-bottom:none;
  border-radius:26px 26px 0 0;
}
#stoveBase::before{content:""; position:absolute; top:16px; left:24px; width:34px; height:34px;
  border-radius:50%; background:#ffd23f; border:4px solid var(--ink);}
#stoveBase::after{content:""; position:absolute; top:16px; right:24px; width:34px; height:34px;
  border-radius:50%; background:#ff8f3c; border:4px solid var(--ink);}
#pan{
  position:absolute; bottom:52px; left:50%; transform:translateX(-50%);
  width:300px; height:110px; background:#4a4a55; border:6px solid var(--ink);
  border-radius:30px 30px 60px 60px / 26px 26px 70px 70px;
  display:flex; align-items:center; justify-content:center; gap:6px;
  font-size:40px; overflow:hidden;
}
#pan::before{content:""; position:absolute; inset:10px 12px 30px; background:#6a6a78; border-radius:20px;}
#pan .c{position:relative; z-index:2; animation:jig 1.2s infinite;}
#pan .c:nth-child(2n){animation-delay:.3s;}
@keyframes jig{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px) rotate(6deg)}}
#panHandle{position:absolute; bottom:104px; left:calc(50% + 140px); width:110px; height:24px;
  background:#3a2a1a; border-radius:12px; border:4px solid var(--ink);}
.steam{position:absolute; z-index:16; font-size:30px; opacity:0; animation:steam 1.4s forwards; pointer-events:none;}
@keyframes steam{0%{opacity:0; transform:translateY(0) scale(.6)}30%{opacity:.9}100%{opacity:0; transform:translateY(-90px) scale(1.4)}}
.burst{position:absolute; z-index:80; pointer-events:none; font-size:28px; animation:burst .7s forwards;}
@keyframes burst{0%{transform:scale(.4); opacity:1}100%{transform:scale(2) translateY(-34px); opacity:0}}
.sparkle{position:absolute; z-index:80; pointer-events:none; font-size:30px; animation:spk 1.1s forwards;}
@keyframes spk{0%{transform:scale(0) rotate(0)}55%{transform:scale(1.3) rotate(30deg)}100%{transform:scale(0) rotate(60deg); opacity:0}}
.shake{animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 8px))}75%{transform:translateX(calc(-50% + 8px))}}

/* ---------- Overlays ---------- */
.overlay{position:fixed; inset:0; z-index:100; display:grid; place-items:center; background:rgba(60,40,20,.45); backdrop-filter:blur(4px);}
.panel{
  background:var(--card); border:5px solid var(--ink); border-radius:32px;
  box-shadow:0 8px 0 var(--ink); padding:28px 30px; width:min(680px,92vw);
  max-height:88vh; overflow:auto;
}
.panel h2{margin:0 0 4px; font-size:26px; letter-spacing:2px;}
.panel p.sub{margin:0 0 18px; color:#8a7358; font-weight:700;}
.lvlgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px;}
.lvlcard{
  border:4px solid var(--ink); border-radius:22px; background:#fff; cursor:pointer;
  padding:16px 12px; text-align:center; box-shadow:0 5px 0 var(--ink); transition:transform .08s;
}
.lvlcard:active{transform:translateY(5px); box-shadow:none;}
.lvlcard .n{font-size:34px; font-weight:900; color:var(--accent2);}
.lvlcard .t{font-size:16px; font-weight:900; margin:4px 0;}
.lvlcard .d{font-size:12.5px; color:#8a7358; font-weight:700; line-height:1.5;}
.rowbtns{display:flex; gap:12px; justify-content:center; margin-top:20px; flex-wrap:wrap;}
.bigbtn{
  border:4px solid var(--ink); border-radius:20px; padding:12px 26px;
  font-size:18px; font-weight:900; cursor:pointer; background:var(--sun);
  box-shadow:0 5px 0 var(--ink); font-family:inherit; letter-spacing:1px;
}
.bigbtn.alt{background:#fff;}
.bigbtn:active{transform:translateY(5px); box-shadow:none;}
#winPanel{text-align:center;}
#winPanel .dish{font-size:96px; margin:8px 0;}

#settings .grp{margin:14px 0 4px; font-size:15px; font-weight:900; color:var(--accent2);}
.optrow{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0;}
.chip{border:3px solid var(--ink); background:#fff; border-radius:999px; padding:7px 16px; font-size:14px; font-weight:900; cursor:pointer; font-family:inherit;}
.chip.sel{background:var(--accent2); color:#fff;}
.hidden{display:none !important;}
</style>
</head>
<body>

<header>
  <h1>🍳 料理遊戲</h1>
  <span class="lvl" id="lvlBadge">—</span>
  <div class="spacer"></div>
  <button class="iconbtn" id="btnSound" title="音效">🔊</button>
  <button class="iconbtn" id="btnSettings" title="調整">⚙️</button>
  <button class="iconbtn" id="btnHome" title="選擇分級">🏠</button>
</header>

<div id="stage">
  <div id="bg" class="rich">
    <div class="deco shelf">🫙🍶🧂🫙</div>
    <div class="deco window"></div>
    <div class="glow" style="opacity:0"></div>
  </div>

  <div id="grid"></div>

  <div id="stove">
    <div id="panHandle"></div>
    <div id="pan"></div>
    <div id="stoveBase"></div>
  </div>
</div>

<div id="steps"></div>
<div id="banner">請選擇分級開始</div>

<!-- Level select -->
<div class="overlay" id="homeOverlay">
  <div class="panel">
    <h2>🍳 料理遊戲</h2>
    <p class="sub">依照步驟點選食材、器具、調味罐，做出好料理！</p>
    <div class="lvlgrid">
      <div class="lvlcard" data-lvl="1">
        <div class="n">1格</div><div class="t">點整個畫面</div>
        <div class="d">點畫面任何地方<br>就做下一步</div>
      </div>
      <div class="lvlcard" data-lvl="2">
        <div class="n">2格</div><div class="t">大目標</div>
        <div class="d">目標物是半個畫面<br>點到就做料理</div>
      </div>
      <div class="lvlcard" data-lvl="4">
        <div class="n">4格</div><div class="t">中目標</div>
        <div class="d">目標物是 1/4 畫面<br>找到並點選它</div>
      </div>
      <div class="lvlcard" data-lvl="6">
        <div class="n">6格</div><div class="t">小目標</div>
        <div class="d">目標物是 1/6 畫面<br>找到並點選它</div>
      </div>
    </div>
    <div class="rowbtns">
      <button class="bigbtn alt" id="homeSettings">⚙️ 調整設定</button>
    </div>
  </div>
</div>

<!-- Win -->
<div class="overlay hidden" id="winOverlay">
  <div class="panel" id="winPanel">
    <div class="dish" id="winDish">🍳</div>
    <h2 id="winTitle">完成！</h2>
    <div class="rowbtns">
      <button class="bigbtn" id="btnAgain">🔁 再煮一次</button>
      <button class="bigbtn alt" id="btnNextRecipe">🍽️ 換一道菜</button>
      <button class="bigbtn alt" id="btnPick">🏠 選擇分級</button>
    </div>
  </div>
</div>

<!-- Settings -->
<div class="overlay hidden" id="settingsOverlay">
  <div class="panel" id="settings">
    <h2>⚙️ 可調整</h2>

    <div class="grp">食譜</div>
    <div class="optrow">
      <button class="chip" data-set="recipe" data-val="egg">香香炒蛋</button>
      <button class="chip" data-set="recipe" data-val="soup">蔬菜湯</button>
      <button class="chip" data-set="recipe" data-val="pancake">鬆餅</button>
    </div>

    <div class="grp">目標物大小</div>
    <div class="optrow">
      <button class="chip" data-set="targetSize" data-val="s">小</button>
      <button class="chip" data-set="targetSize" data-val="m">中</button>
      <button class="chip" data-set="targetSize" data-val="l">大</button>
    </div>

    <div class="grp">目標物位置</div>
    <div class="optrow">
      <button class="chip" data-set="targetPos" data-val="random">每步隨機</button>
      <button class="chip" data-set="targetPos" data-val="fixed">固定同一格</button>
      <button class="chip" data-set="targetPos" data-val="corner">固定角落</button>
    </div>

    <div class="grp">更換背景圖</div>
    <div class="optrow">
      <button class="chip" data-set="bg" data-val="simple">簡單</button>
      <button class="chip" data-set="bg" data-val="rich">複雜</button>
      <button class="chip" data-set="bg" data-val="contrast">高對比</button>
    </div>

    <div class="rowbtns">
      <button class="bigbtn" id="btnApply">✅ 套用並重新開始</button>
      <button class="bigbtn alt" id="btnCloseSettings">關閉</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* ================= data ================= */
const RECIPES = {
  egg:{ name:"香香炒蛋", dish:"🍳", steps:[
    {item:"🥚", label:"打<b>蛋</b>下鍋"},
    {item:"🧈", label:"加一塊<b>奶油</b>"},
    {item:"🧂", label:"撒一點<b>鹽巴</b>"},
    {item:"🥄", label:"用<b>湯匙</b>攪一攪"},
    {item:"🍽️", label:"拿<b>盤子</b>裝起來"},
  ]},
  soup:{ name:"蔬菜湯", dish:"🍲", steps:[
    {item:"💧", label:"加<b>水</b>進鍋子"},
    {item:"🥕", label:"放<b>紅蘿蔔</b>"},
    {item:"🥦", label:"放<b>青花菜</b>"},
    {item:"🧂", label:"加一點<b>鹽</b>"},
    {item:"🥄", label:"用<b>湯勺</b>攪一攪"},
  ]},
  pancake:{ name:"鬆餅", dish:"🥞", steps:[
    {item:"🥣", label:"倒入<b>麵粉</b>"},
    {item:"🥚", label:"打一顆<b>蛋</b>"},
    {item:"🥛", label:"加<b>牛奶</b>"},
    {item:"🥄", label:"攪拌<b>麵糊</b>"},
    {item:"🍯", label:"淋上<b>蜂蜜</b>"},
  ]},
};

/* ================= state ================= */
const S = { level:0, step:0, running:false, busy:false, sound:true, targetCell:0 };
const CFG = { recipe:"egg", targetSize:"m", targetPos:"random", bg:"rich" };
const TSIZE = { s:.62, m:1, l:1.35 };
const GRIDS = { 2:[2,1], 4:[2,2], 6:[3,2] };

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const stage=$("#stage"), grid=$("#grid"), banner=$("#banner"), stepsEl=$("#steps"), pan=$("#pan");

/* ================= audio ================= */
let AC=null;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); return AC; }
function tone(f,dur=.15,type="sine",vol=.25,slideTo=null){
  if(!S.sound) return;
  try{
    const a=ac(),o=a.createOscillator(),g=a.createGain();
    o.type=type; o.frequency.value=f;
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,a.currentTime+dur);
    g.gain.setValueAtTime(vol,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+dur);
  }catch(e){}
}
function sSizzle(){ if(!S.sound) return;
  try{
    const a=ac(),len=a.sampleRate*.45,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len)*.8;
    const src=a.createBufferSource(); src.buffer=buf;
    const f=a.createBiquadFilter(); f.type="bandpass"; f.frequency.value=3200; f.Q.value=.7;
    const g=a.createGain(); g.gain.value=.18;
    src.connect(f).connect(g).connect(a.destination); src.start();
  }catch(e){}
}
const sPop  = () => tone(600,.12,"sine",.3,920);
const sDing = () => { tone(880,.3,"sine",.3); setTimeout(()=>tone(1320,.35,"sine",.25),110); };
const sNo   = () => tone(170,.18,"square",.1,130);
function sWin(){ [523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>tone(f,.28,"sine",.28), i*130)); }

/* ================= helpers ================= */
const recipe = () => RECIPES[CFG.recipe];
function fx(emoji,x,y,cls="burst"){
  const e=document.createElement("div"); e.className=cls; e.textContent=emoji;
  e.style.left=x+"px"; e.style.top=y+"px"; document.body.appendChild(e);
  setTimeout(()=>e.remove(), cls==="burst"?750:1450);
}
function renderSteps(){
  stepsEl.innerHTML="";
  recipe().steps.forEach((st,i)=>{
    const sp=document.createElement("span");
    sp.textContent=st.item;
    if(i<S.step) sp.classList.add("done");
    if(i===S.step) sp.classList.add("on");
    stepsEl.appendChild(sp);
  });
}
function setBannerStep(){
  const st = recipe().steps[S.step];
  const where = S.level===1 ? "點選<b>畫面</b>" : "點選目標";
  banner.innerHTML = `第 ${S.step+1} 步：${st.label}　${S.level===1?"（點畫面）":""}`;
}

/* ================= grid & target ================= */
function gridArea(){
  const W=innerWidth, H=innerHeight;
  return { left:14, top:196, width:W-28, height:H-196-200 };
}
function pickCell(nCells){
  if(CFG.targetPos==="corner") return 0;
  if(CFG.targetPos==="fixed")  return Math.floor(nCells/2);
  let c = Math.floor(Math.random()*nCells);
  if(nCells>1 && c===S.targetCell) c=(c+1)%nCells; // avoid repeating same cell
  return c;
}
function renderGrid(){
  grid.innerHTML="";
  if(S.level===1){ grid.style.display="none"; renderLevel1Target(); return; }
  $("#soloTarget")?.remove();
  const [cols,rows]=GRIDS[S.level];
  const a=gridArea();
  Object.assign(grid.style,{
    display:"grid", left:a.left+"px", top:a.top+"px",
    width:a.width+"px", height:a.height+"px",
    gridTemplateColumns:`repeat(${cols},1fr)`, gridTemplateRows:`repeat(${rows},1fr)`,
  });
  const n=cols*rows;
  S.targetCell = pickCell(n);
  const cellW=a.width/cols, cellH=a.height/rows;
  const fs = Math.min(cellW,cellH) * 0.5 * TSIZE[CFG.targetSize];
  for(let i=0;i<n;i++){
    const cell=document.createElement("div");
    cell.className="gcell";
    if(i===S.targetCell){
      cell.classList.add("hastarget");
      const t=document.createElement("div");
      t.className="target"; t.textContent=recipe().steps[S.step].item;
      t.style.fontSize=fs+"px";
      cell.appendChild(t);
      cell.addEventListener("pointerdown", ev=>{ ev.stopPropagation(); onHit(cell); });
    } else {
      cell.addEventListener("pointerdown", ev=>{ ev.stopPropagation(); onMiss(); });
    }
    grid.appendChild(cell);
  }
}
function renderLevel1Target(){
  $("#soloTarget")?.remove();
  const a=gridArea();
  const t=document.createElement("div");
  t.id="soloTarget"; t.className="target";
  t.textContent=recipe().steps[S.step].item;
  const fs=Math.min(a.width,a.height)*0.42*TSIZE[CFG.targetSize];
  Object.assign(t.style,{
    position:"absolute", zIndex:20, fontSize:fs+"px",
    left:"50%", top:(a.top + a.height/2)+"px", transform:"translate(-50%,-50%)",
  });
  stage.appendChild(t);
}

/* ================= game flow ================= */
function startGame(level){
  S.level=level; S.running=true; S.busy=false; S.step=0; S.targetCell=-1;
  $("#lvlBadge").textContent=level+"格";
  $("#homeOverlay").classList.add("hidden");
  $("#winOverlay").classList.add("hidden");
  $("#bg").className=CFG.bg;
  pan.innerHTML="";
  renderSteps(); setBannerStep(); renderGrid();
}
function onHit(srcEl){
  if(!S.running||S.busy) return;
  S.busy=true; ac(); sPop();
  const item=recipe().steps[S.step].item;
  // fly the item into the pan
  const from=(srcEl||$("#soloTarget")).getBoundingClientRect();
  const to=pan.getBoundingClientRect();
  const f=document.createElement("div"); f.className="flyer"; f.textContent=item;
  f.style.left=(from.left+from.width/2-24)+"px";
  f.style.top=(from.top+from.height/2-24)+"px";
  f.style.fontSize="48px";
  document.body.appendChild(f);
  requestAnimationFrame(()=>{
    f.style.left=(to.left+to.width/2-20)+"px";
    f.style.top=(to.top+8)+"px";
    f.style.fontSize="36px";
  });
  setTimeout(()=>{
    f.remove(); sSizzle();
    const c=document.createElement("span"); c.className="c"; c.textContent=item;
    pan.appendChild(c);
    const pr=pan.getBoundingClientRect();
    fx("💨", pr.left+pr.width*0.3, pr.top-10, "steam");
    fx("💨", pr.left+pr.width*0.6, pr.top-10, "steam");
    S.step++;
    if(S.step>=recipe().steps.length){ finish(); return; }
    renderSteps(); setBannerStep(); renderGrid();
    S.busy=false;
  }, 580);
}
function onMiss(){
  if(!S.running||S.busy) return;
  ac(); sNo();
  pan.parentElement.classList.remove("shake");
}
function finish(){
  S.running=false;
  renderSteps();
  banner.innerHTML=`🎉 <b>${recipe().name}</b>完成了！`;
  pan.innerHTML=`<span class="c" style="font-size:64px">${recipe().dish}</span>`;
  sDing(); setTimeout(sWin,300);
  const pr=pan.getBoundingClientRect();
  for(let i=0;i<10;i++){
    setTimeout(()=>{
      const e=document.createElement("div"); e.className="sparkle";
      e.textContent=["✨","🌟","⭐"][i%3];
      e.style.left=(pr.left+Math.random()*pr.width)+"px";
      e.style.top=(pr.top-40+Math.random()*80)+"px";
      document.body.appendChild(e); setTimeout(()=>e.remove(),1200);
    }, i*110);
  }
  setTimeout(()=>{
    $("#winDish").textContent=recipe().dish;
    $("#winTitle").textContent=recipe().name+"完成！好香喔！";
    $("#winOverlay").classList.remove("hidden");
  }, 1500);
}

/* level 1: whole-screen tap */
stage.addEventListener("pointerdown", ()=>{
  if(!S.running||S.busy) return;
  if(S.level===1) onHit(null);
});

/* ================= wiring ================= */
$$(".lvlcard").forEach(c=>c.addEventListener("click", ()=>{ ac(); startGame(+c.dataset.lvl); }));
$("#btnAgain").addEventListener("click", ()=>startGame(S.level));
$("#btnNextRecipe").addEventListener("click", ()=>{
  const keys=Object.keys(RECIPES);
  CFG.recipe = keys[(keys.indexOf(CFG.recipe)+1)%keys.length];
  startGame(S.level);
});
$("#btnPick").addEventListener("click", ()=>{ $("#winOverlay").classList.add("hidden"); $("#homeOverlay").classList.remove("hidden"); });
$("#btnHome").addEventListener("click", ()=>{ S.running=false; $("#homeOverlay").classList.remove("hidden"); });
$("#btnSound").addEventListener("click", e=>{ S.sound=!S.sound; e.currentTarget.textContent=S.sound?"🔊":"🔇"; });

const settingsOverlay=$("#settingsOverlay");
function syncSettingsUI(){ $$(".chip").forEach(ch=>ch.classList.toggle("sel", CFG[ch.dataset.set]===ch.dataset.val)); }
$$(".chip").forEach(ch=>ch.addEventListener("click", ()=>{ CFG[ch.dataset.set]=ch.dataset.val; syncSettingsUI(); }));
function openSettings(){ syncSettingsUI(); settingsOverlay.classList.remove("hidden"); }
$("#btnSettings").addEventListener("click", openSettings);
$("#homeSettings").addEventListener("click", openSettings);
$("#btnCloseSettings").addEventListener("click", ()=>settingsOverlay.classList.add("hidden"));
$("#btnApply").addEventListener("click", ()=>{
  settingsOverlay.classList.add("hidden");
  $("#bg").className=CFG.bg;
  if(S.level) startGame(S.level);
});
window.addEventListener("resize", ()=>{ if(S.running) renderGrid(); });
</script>
</body>
</html>
