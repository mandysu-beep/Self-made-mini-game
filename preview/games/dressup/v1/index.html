<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>換裝遊戲</title>
<style>
:root{
  --ink:#2b2140; --card:#fff;
  --accent:#ff5fa2; --accent2:#7a5cff; --ok:#2fbf71; --sun:#ffd23f;
  --arrow-fs:64px; --thumb-scale:1;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{height:100%; margin:0;}
body{
  font-family:"jf-openhuninn","Yuanti TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color:var(--ink); background:#fdf3fa; overflow:hidden;
}

/* ---------- Header ---------- */
header{
  position:fixed; top:0; left:0; right:0; z-index:60;
  display:flex; align-items:center; gap:10px; padding:10px 14px;
  background:rgba(255,255,255,.88); backdrop-filter:blur(8px);
  border-bottom:3px solid rgba(43,33,64,.08);
}
header h1{font-size:20px; margin:0; letter-spacing:2px; font-weight:900;}
header .lvl{margin-left:6px; font-size:13px; font-weight:800; color:#fff; background:var(--accent2); padding:4px 12px; border-radius:999px;}
header .spacer{flex:1;}
.iconbtn{
  width:46px; height:46px; border-radius:16px; border:3px solid var(--ink);
  background:#fff; font-size:20px; cursor:pointer; box-shadow:0 3px 0 var(--ink); transition:transform .08s;
}
.iconbtn:active{transform:translateY(3px); box-shadow:none;}

/* ---------- Stage & backgrounds ---------- */
#stage{position:fixed; inset:0; padding-top:66px; overflow:hidden;}
#bg{position:absolute; inset:0; z-index:0; transition:background .4s;}
#bg.simple{background:linear-gradient(#fff2fb 0 70%, #ffe1c9 70% 100%);}
#bg.rich{background:linear-gradient(#ffe9f5 0 68%, #e8c79b 68% 100%);}
#bg.contrast{background:linear-gradient(#161320 0 68%, #2e2840 68% 100%);}
#bg .deco{position:absolute; opacity:0; transition:opacity .4s;}
#bg.rich .deco{opacity:1;}
.wardrobe{left:5%; bottom:32%; width:150px; height:220px; background:#c98a4b; border:5px solid #8a5a33; border-radius:12px;}
.wardrobe::before{content:""; position:absolute; inset:10px 50% 10px 10px; background:#e7b27a; border-radius:8px; border:3px solid #8a5a33;}
.wardrobe::after{content:""; position:absolute; inset:10px 10px 10px 50%; background:#e7b27a; border-radius:8px; border:3px solid #8a5a33;}
.mirror{right:6%; bottom:32%; width:110px; height:200px; background:#cdefff; border:8px solid #ffb0d4; border-radius:60px;}
.rug{left:50%; transform:translateX(-50%); bottom:6%; width:52%; height:56px; background:repeating-linear-gradient(90deg,#ff9ec6 0 34px,#ffd0e5 34px 68px); border-radius:50%; opacity:.9;}
.bunting{top:76px; left:0; right:0; height:40px;
  background:
   radial-gradient(circle at 10% 0, transparent 0, transparent 0) ,
   linear-gradient(#0000,#0000);}
.bunting::before{content:"🎀 ✨ 🎀 ✨ 🎀 ✨ 🎀"; position:absolute; width:100%; text-align:center; font-size:20px; letter-spacing:20px;}
#bg.contrast .floorline{position:absolute; left:0; right:0; top:68%; height:6px; background:#ffe24a; opacity:1;}

/* ---------- Cells ---------- */
.cell{
  position:absolute; z-index:20; display:grid; place-items:center;
  background:rgba(255,255,255,.75); border:5px solid var(--ink);
  border-radius:26px; cursor:pointer; box-shadow:0 6px 0 var(--ink);
  transition:transform .08s, background .2s;
}
#bg.contrast ~ * .cell{background:rgba(255,255,255,.92);}
.cell:active{transform:translateY(5px); box-shadow:none;}
.cell .glyph{font-size:var(--arrow-fs); font-weight:900; line-height:1;}
.cell.arrow{color:var(--accent2);}
.cell.ok{color:var(--ok); background:#eafff3;}
.cell.hint{animation:cellpulse 1.6s infinite;}
@keyframes cellpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

#charCell{
  z-index:10; display:grid; place-items:center; position:absolute;
  border-radius:26px; border:5px solid transparent;
}
#charCell.confirmable{
  cursor:pointer; background:rgba(255,255,255,.6);
  border-color:var(--ink); box-shadow:0 6px 0 var(--ink);
}
#charCell .okbadge{
  display:none; position:absolute; top:10px; right:12px;
  background:var(--ok); color:#fff; font-weight:900; font-size:16px;
  padding:6px 14px; border-radius:999px; border:3px solid var(--ink);
}
#charCell.confirmable .okbadge{display:block;}
#charSVG{height:100%; max-height:100%; width:auto; display:block; filter:drop-shadow(0 10px 8px rgba(0,0,0,.15));}
.pose{animation:bounce .5s ease;}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) rotate(-2deg)}70%{transform:translateY(0) rotate(1.5deg)}}

/* cards (6格) */
#cards{
  position:absolute; z-index:20; left:50%; transform:translateX(-50%);
  bottom:16px; display:none; gap:14px;
}
#cards.show{display:flex;}
.ocard{
  width:calc(128px * var(--thumb-scale)); height:calc(148px * var(--thumb-scale));
  background:#fff; border:5px solid var(--ink); border-radius:22px;
  box-shadow:0 6px 0 var(--ink); cursor:pointer; display:grid; place-items:center;
  transition:transform .08s;
}
.ocard:active{transform:translateY(5px); box-shadow:none;}
.ocard.sel{background:#fff3c6; border-color:var(--accent); outline:5px solid var(--accent); outline-offset:3px;}
.ocard svg{width:82%; height:82%;}

/* ---------- Banner / fx ---------- */
#banner{
  position:fixed; z-index:55; left:50%; transform:translateX(-50%); top:80px;
  background:var(--card); border:4px solid var(--ink); border-radius:26px;
  padding:10px 24px; font-size:19px; font-weight:900; letter-spacing:1px;
  box-shadow:0 5px 0 var(--ink); max-width:88vw; text-align:center;
}
#banner b{color:var(--accent);}
.burst{position:absolute; z-index:40; pointer-events:none; font-size:28px; animation:burst .7s forwards;}
@keyframes burst{0%{transform:scale(.4); opacity:1}100%{transform:scale(2) translateY(-34px); opacity:0}}
.sparkle{position:absolute; z-index:40; pointer-events:none; font-size:30px; animation:spk 1.1s forwards;}
@keyframes spk{0%{transform:scale(0) rotate(0)}55%{transform:scale(1.3) rotate(30deg)}100%{transform:scale(0) rotate(60deg); opacity:0}}

/* ---------- Overlays ---------- */
.overlay{position:fixed; inset:0; z-index:100; display:grid; place-items:center; background:rgba(50,30,60,.45); backdrop-filter:blur(4px);}
.panel{
  background:var(--card); border:5px solid var(--ink); border-radius:32px;
  box-shadow:0 8px 0 var(--ink); padding:28px 30px; width:min(680px,92vw);
  max-height:88vh; overflow:auto;
}
.panel h2{margin:0 0 4px; font-size:26px; letter-spacing:2px;}
.panel p.sub{margin:0 0 18px; color:#7a6a8a; font-weight:700;}
.lvlgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px;}
.lvlcard{
  border:4px solid var(--ink); border-radius:22px; background:#fff; cursor:pointer;
  padding:16px 12px; text-align:center; box-shadow:0 5px 0 var(--ink); transition:transform .08s;
}
.lvlcard:active{transform:translateY(5px); box-shadow:none;}
.lvlcard .n{font-size:34px; font-weight:900; color:var(--accent2);}
.lvlcard .t{font-size:16px; font-weight:900; margin:4px 0;}
.lvlcard .d{font-size:12.5px; color:#7a6a8a; font-weight:700; line-height:1.5;}
.rowbtns{display:flex; gap:12px; justify-content:center; margin-top:20px; flex-wrap:wrap;}
.bigbtn{
  border:4px solid var(--ink); border-radius:20px; padding:12px 26px;
  font-size:18px; font-weight:900; cursor:pointer; background:var(--sun);
  box-shadow:0 5px 0 var(--ink); font-family:inherit; letter-spacing:1px;
}
.bigbtn.alt{background:#fff;}
.bigbtn:active{transform:translateY(5px); box-shadow:none;}
#winPanel{text-align:center;}
#winPanel .big{font-size:52px; margin:4px 0;}
#winChar svg{height:220px;}

#settings .grp{margin:14px 0 4px; font-size:15px; font-weight:900; color:var(--accent2);}
.optrow{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0;}
.optrow .lab{flex-basis:100%; font-size:13.5px; font-weight:800; color:#7a6a8a;}
.chip{border:3px solid var(--ink); background:#fff; border-radius:999px; padding:7px 16px; font-size:14px; font-weight:900; cursor:pointer; font-family:inherit;}
.chip.sel{background:var(--accent2); color:#fff;}
.hidden{display:none !important;}
</style>
</head>
<body>

<header>
  <h1>👗 換裝遊戲</h1>
  <span class="lvl" id="lvlBadge">—</span>
  <div class="spacer"></div>
  <button class="iconbtn" id="btnSound" title="音效">🔊</button>
  <button class="iconbtn" id="btnSettings" title="調整">⚙️</button>
  <button class="iconbtn" id="btnHome" title="選擇分級">🏠</button>
</header>

<div id="stage">
  <div id="bg" class="rich">
    <div class="deco wardrobe"></div>
    <div class="deco mirror"></div>
    <div class="deco rug"></div>
    <div class="deco bunting"></div>
    <div class="floorline" style="opacity:0"></div>
  </div>

  <div id="charCell">
    <span class="okbadge">按我確認 ✓</span>
    <div id="charSVG"></div>
  </div>

  <div class="cell arrow hidden" id="arrowL"><span class="glyph">◀</span></div>
  <div class="cell arrow hidden" id="arrowR"><span class="glyph">▶</span></div>
  <div class="cell ok hidden" id="okBtn"><span class="glyph">✓</span></div>
  <div id="cards"></div>
</div>

<div id="banner">請選擇分級開始</div>

<!-- Level select -->
<div class="overlay" id="homeOverlay">
  <div class="panel">
    <h2>👗 換裝遊戲</h2>
    <p class="sub">選擇衣服、配件幫角色換裝</p>
    <div class="lvlgrid">
      <div class="lvlcard" data-lvl="1">
        <div class="n">1格</div><div class="t">點整個畫面</div>
        <div class="d">按畫面就換裝<br>換好了給老師看</div>
      </div>
      <div class="lvlcard" data-lvl="2">
        <div class="n">2格</div><div class="t">箭頭換裝＋按角色確認</div>
        <div class="d">一格箭頭換衣服<br>一格按角色確認</div>
      </div>
      <div class="lvlcard" data-lvl="4">
        <div class="n">4格</div><div class="t">左右箭頭＋打勾</div>
        <div class="d">左右箭頭換衣服<br>角落打勾確認</div>
      </div>
      <div class="lvlcard" data-lvl="6">
        <div class="n">6格</div><div class="t">直接選衣服</div>
        <div class="d">下方三套直接選<br>右上打勾確認</div>
      </div>
    </div>
    <div class="rowbtns">
      <button class="bigbtn alt" id="homeSettings">⚙️ 調整設定</button>
    </div>
  </div>
</div>

<!-- Win -->
<div class="overlay hidden" id="winOverlay">
  <div class="panel" id="winPanel">
    <div class="big">🎉👏✨</div>
    <h2>選好了！好好看！</h2>
    <div id="winChar"></div>
    <div class="rowbtns">
      <button class="bigbtn" id="btnAgain">🔁 再玩一次</button>
      <button class="bigbtn alt" id="btnPick">🏠 選擇分級</button>
    </div>
  </div>
</div>

<!-- Settings -->
<div class="overlay hidden" id="settingsOverlay">
  <div class="panel" id="settings">
    <h2>⚙️ 可調整</h2>

    <div class="grp">更換人物</div>
    <div class="optrow">
      <button class="chip" data-set="who" data-val="a">小奇</button>
      <button class="chip" data-set="who" data-val="b">小美</button>
      <button class="chip" data-set="who" data-val="c">小安</button>
    </div>

    <div class="grp">更換衣服（主題）</div>
    <div class="optrow">
      <button class="chip" data-set="theme" data-val="daily">日常</button>
      <button class="chip" data-set="theme" data-val="party">派對</button>
      <button class="chip" data-set="theme" data-val="sport">運動</button>
    </div>

    <div class="grp">更換背景</div>
    <div class="optrow">
      <button class="chip" data-set="bg" data-val="simple">簡單</button>
      <button class="chip" data-set="bg" data-val="rich">複雜</button>
      <button class="chip" data-set="bg" data-val="contrast">高對比</button>
    </div>

    <div class="grp">箭頭大小</div>
    <div class="optrow">
      <button class="chip" data-set="arrowSize" data-val="s">小</button>
      <button class="chip" data-set="arrowSize" data-val="m">中</button>
      <button class="chip" data-set="arrowSize" data-val="l">大</button>
    </div>

    <div class="grp">衣服大小（選項卡）</div>
    <div class="optrow">
      <button class="chip" data-set="thumbSize" data-val="s">小</button>
      <button class="chip" data-set="thumbSize" data-val="m">中</button>
      <button class="chip" data-set="thumbSize" data-val="l">大</button>
    </div>

    <div class="rowbtns">
      <button class="bigbtn" id="btnApply">✅ 套用並重新開始</button>
      <button class="bigbtn alt" id="btnCloseSettings">關閉</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* ================= state ================= */
const S = { level:0, running:false, idx:0, offset:0, sound:true };
const CFG = { who:"a", theme:"daily", bg:"rich", arrowSize:"m", thumbSize:"m" };
const ARROW = { s:"44px", m:"64px", l:"92px" };
const THUMB = { s:.8, m:1, l:1.35 };

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const stage = $("#stage"), charCell = $("#charCell"), charSVG = $("#charSVG");
const arrowL = $("#arrowL"), arrowR = $("#arrowR"), okBtn = $("#okBtn"), cards = $("#cards");
const banner = $("#banner");

/* ================= audio ================= */
let AC = null;
function ac(){ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); return AC; }
function tone(f, dur=.15, type="sine", vol=.25, slideTo=null){
  if(!S.sound) return;
  try{
    const a=ac(), o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.value=f;
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime+dur);
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, a.currentTime+dur);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+dur);
  }catch(e){}
}
const sSwap = () => { tone(520,.1,"sine",.25,760); setTimeout(()=>tone(760,.1,"sine",.2,980),70); };
const sPick = () => tone(660,.12,"sine",.3,990);
const sNo   = () => tone(180,.18,"square",.1,140);
function sWin(){ [523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>tone(f,.28,"sine",.28), i*130)); }

/* ================= characters & outfits ================= */
const CHARS = {
  a:{ skin:"#ffd9b3", hair:"#3a2c22", style:"short",  name:"小奇" },
  b:{ skin:"#f6c99f", hair:"#7a4a21", style:"tails",  name:"小美" },
  c:{ skin:"#a06a42", hair:"#241a12", style:"curly",  name:"小安" },
};
/* kind: tee-shorts | tee-pants | dress | skirt | hoodie | overalls
   pat: solid | dots | stripes ; hat: cap | bow | null */
const THEMES = {
  daily:[
    {kind:"tee-shorts", c1:"#ff5a4e", c2:"#2f6fd6", pat:"solid",   hat:"cap"},
    {kind:"dress",      c1:"#ffd23f", c2:"#ffffff", pat:"dots",    hat:null},
    {kind:"hoodie",     c1:"#37b26c", c2:"#274060", pat:"solid",   hat:null},
    {kind:"overalls",   c1:"#ffffff", c2:"#4a90d9", pat:"stripes", hat:null},
    {kind:"skirt",      c1:"#ffffff", c2:"#ff8fc0", pat:"solid",   hat:"bow"},
    {kind:"tee-pants",  c1:"#ff9a3c", c2:"#3f7d4e", pat:"solid",   hat:null},
  ],
  party:[
    {kind:"dress",      c1:"#8e5cff", c2:"#ffd23f", pat:"dots",    hat:"bow"},
    {kind:"tee-pants",  c1:"#222833", c2:"#5b6570", pat:"solid",   hat:null},
    {kind:"dress",      c1:"#ffca3a", c2:"#ffffff", pat:"solid",   hat:null},
    {kind:"skirt",      c1:"#ff6b81", c2:"#2ec4b6", pat:"dots",    hat:"bow"},
    {kind:"tee-shorts", c1:"#e63946", c2:"#1d3557", pat:"stripes", hat:null},
    {kind:"dress",      c1:"#2ec4b6", c2:"#ffffff", pat:"stripes", hat:null},
  ],
  sport:[
    {kind:"tee-shorts", c1:"#1d7dd8", c2:"#ffffff", pat:"stripes", hat:"cap"},
    {kind:"hoodie",     c1:"#e63946", c2:"#222833", pat:"solid",   hat:null},
    {kind:"tee-shorts", c1:"#37b26c", c2:"#ffd23f", pat:"solid",   hat:null},
    {kind:"tee-pants",  c1:"#ffffff", c2:"#1d3557", pat:"dots",    hat:"cap"},
    {kind:"tee-shorts", c1:"#ff9a3c", c2:"#274060", pat:"solid",   hat:"cap"},
    {kind:"hoodie",     c1:"#5b6570", c2:"#37b26c", pat:"stripes", hat:null},
  ],
};
let clipN = 0;

function patFill(shapePath, c1, pat){
  clipN++;
  let extra = "";
  if(pat==="dots"){
    let dots = "";
    for(let y=170; y<=420; y+=34) for(let x=70; x<=230; x+=34)
      dots += `<circle cx="${x + (y%68?17:0)}" cy="${y}" r="7" fill="rgba(255,255,255,.85)"/>`;
    extra = `<g clip-path="url(#cp${clipN})">${dots}</g>`;
  } else if(pat==="stripes"){
    let st = "";
    for(let y=160; y<=430; y+=40) st += `<rect x="40" y="${y}" width="220" height="14" fill="rgba(255,255,255,.75)"/>`;
    extra = `<g clip-path="url(#cp${clipN})">${st}</g>`;
  }
  return `
    <clipPath id="cp${clipN}"><path d="${shapePath}"/></clipPath>
    <path d="${shapePath}" fill="${c1}" stroke="#2b2140" stroke-width="8" stroke-linejoin="round"/>
    ${extra}`;
}

const SHAPES = {
  tee:    "M96 172 h108 q10 0 10 12 v92 q0 14 -14 14 h-100 q-14 0 -14 -14 v-92 q0 -12 10 -12 z",
  sleeveL:"M100 176 q-30 6 -34 52 q-2 14 12 16 l24 4 z",
  sleeveR:"M200 176 q30 6 34 52 q2 14 -12 16 l-24 -4 z",
  shorts: "M104 284 h92 q10 0 10 10 v44 q0 10 -10 10 h-28 l-18 -22 -18 22 h-28 q-10 0 -10 -10 v-44 q0 -10 10 -10 z",
  pants:  "M104 284 h92 q10 0 10 10 v112 q0 10 -10 10 h-26 q-10 0 -10 -10 l-10 -74 -10 74 q0 10 -10 10 h-26 q-10 0 -10 -10 v-112 q0 -10 10 -10 z",
  dress:  "M96 172 h108 q10 0 10 12 l22 154 q2 14 -12 14 h-148 q-14 0 -12 -14 l22 -154 q0 -12 10 -12 z",
  skirt:  "M100 282 h100 l18 62 q4 12 -10 12 h-116 q-14 0 -10 -12 z",
  bib:    "M120 196 h60 q8 0 8 8 v76 h-76 v-76 q0 -8 8 -8 z",
};

function outfitSVG(o){
  let s = "";
  const bottomColor = o.c2;
  if(o.kind==="tee-shorts"){
    s += patFill(SHAPES.shorts, bottomColor, "solid");
    s += patFill(SHAPES.tee, o.c1, o.pat);
    s += patFill(SHAPES.sleeveL, o.c1, "solid") + patFill(SHAPES.sleeveR, o.c1, "solid");
  } else if(o.kind==="tee-pants"){
    s += patFill(SHAPES.pants, bottomColor, "solid");
    s += patFill(SHAPES.tee, o.c1, o.pat);
    s += patFill(SHAPES.sleeveL, o.c1, "solid") + patFill(SHAPES.sleeveR, o.c1, "solid");
  } else if(o.kind==="dress"){
    s += patFill(SHAPES.dress, o.c1, o.pat);
    s += patFill(SHAPES.sleeveL, o.c1, "solid") + patFill(SHAPES.sleeveR, o.c1, "solid");
  } else if(o.kind==="skirt"){
    s += patFill(SHAPES.skirt, bottomColor, o.pat);
    s += patFill(SHAPES.tee, o.c1, "solid");
    s += patFill(SHAPES.sleeveL, o.c1, "solid") + patFill(SHAPES.sleeveR, o.c1, "solid");
  } else if(o.kind==="hoodie"){
    s += patFill(SHAPES.pants, bottomColor, "solid");
    s += patFill(SHAPES.tee, o.c1, o.pat);
    s += patFill(SHAPES.sleeveL, o.c1, "solid") + patFill(SHAPES.sleeveR, o.c1, "solid");
    s += `<path d="M118 176 q32 26 64 0 q6 22 -32 24 q-38 -2 -32 -24 z" fill="${shade(o.c1)}" stroke="#2b2140" stroke-width="7" stroke-linejoin="round"/>
          <rect x="126" y="238" width="48" height="34" rx="10" fill="${shade(o.c1)}" stroke="#2b2140" stroke-width="7"/>`;
  } else if(o.kind==="overalls"){
    s += patFill(SHAPES.tee, o.c1, o.pat);
    s += patFill(SHAPES.sleeveL, o.c1, "solid") + patFill(SHAPES.sleeveR, o.c1, "solid");
    s += patFill(SHAPES.pants, bottomColor, "solid");
    s += patFill(SHAPES.bib, bottomColor, "solid");
    s += `<rect x="112" y="176" width="14" height="34" rx="6" fill="${bottomColor}" stroke="#2b2140" stroke-width="6"/>
          <rect x="174" y="176" width="14" height="34" rx="6" fill="${bottomColor}" stroke="#2b2140" stroke-width="6"/>
          <circle cx="128" cy="210" r="6" fill="#ffd23f" stroke="#2b2140" stroke-width="4"/>
          <circle cx="181" cy="210" r="6" fill="#ffd23f" stroke="#2b2140" stroke-width="4"/>`;
  }
  if(o.hat==="cap"){
    s += `<path d="M96 88 a54 46 0 0 1 108 0 z" fill="${o.c1==="#ffffff"?o.c2:o.c1}" stroke="#2b2140" stroke-width="8" stroke-linejoin="round"/>
          <rect x="140" y="80" width="86" height="16" rx="8" fill="${shade(o.c1==="#ffffff"?o.c2:o.c1)}" stroke="#2b2140" stroke-width="6"/>`;
  } else if(o.hat==="bow"){
    s += `<g stroke="#2b2140" stroke-width="6" fill="${o.c2==="#ffffff"?o.c1:o.c2}">
            <path d="M186 60 l30 -16 q8 -4 8 6 l0 22 q0 10 -8 6 z"/>
            <path d="M186 60 l30 16 q8 4 8 -6 l0 -22 q0 -10 -8 -6 z" transform="translate(0,0)"/>
            <circle cx="186" cy="60" r="9"/>
          </g>`;
  }
  return s;
}
function shade(hex){
  const n = hex.replace("#","");
  const v = [0,2,4].map(i=>Math.max(0, parseInt(n.substr(i,2),16)-46));
  return "#"+v.map(x=>x.toString(16).padStart(2,"0")).join("");
}

function hairSVG(ch){
  if(ch.style==="short") return `
    <path d="M96 100 a54 54 0 0 1 108 0 l-8 4 q-8 -26 -22 -28 q6 14 2 22 q-24 -22 -56 -12 q-14 6 -16 18 z" fill="${ch.hair}" stroke="#2b2140" stroke-width="7" stroke-linejoin="round"/>`;
  if(ch.style==="tails") return `
    <path d="M96 100 a54 54 0 0 1 108 0 l-10 2 q-4 -24 -44 -24 q-40 0 -44 24 z" fill="${ch.hair}" stroke="#2b2140" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="84" cy="122" r="17" fill="${ch.hair}" stroke="#2b2140" stroke-width="7"/>
    <circle cx="216" cy="122" r="17" fill="${ch.hair}" stroke="#2b2140" stroke-width="7"/>
    <circle cx="84" cy="104" r="7" fill="#ff5fa2" stroke="#2b2140" stroke-width="4"/>
    <circle cx="216" cy="104" r="7" fill="#ff5fa2" stroke="#2b2140" stroke-width="4"/>`;
  return ` <!-- curly -->
    <g fill="${ch.hair}" stroke="#2b2140" stroke-width="7">
      <circle cx="110" cy="72" r="20"/><circle cx="150" cy="60" r="22"/><circle cx="190" cy="72" r="20"/>
      <circle cx="96" cy="96" r="16"/><circle cx="204" cy="96" r="16"/>
    </g>`;
}

function characterSVG(ch, outfit, h=null){
  return `
  <svg viewBox="0 0 300 470" xmlns="http://www.w3.org/2000/svg" ${h?`height="${h}"`:""}>
    <!-- legs -->
    <rect x="116" y="300" width="28" height="120" rx="13" fill="${ch.skin}" stroke="#2b2140" stroke-width="7"/>
    <rect x="156" y="300" width="28" height="120" rx="13" fill="${ch.skin}" stroke="#2b2140" stroke-width="7"/>
    <ellipse cx="126" cy="428" rx="26" ry="14" fill="#5b4bd3" stroke="#2b2140" stroke-width="7"/>
    <ellipse cx="174" cy="428" rx="26" ry="14" fill="#5b4bd3" stroke="#2b2140" stroke-width="7"/>
    <!-- arms -->
    <rect x="70" y="182" width="26" height="98" rx="13" fill="${ch.skin}" stroke="#2b2140" stroke-width="7"/>
    <rect x="204" y="182" width="26" height="98" rx="13" fill="${ch.skin}" stroke="#2b2140" stroke-width="7"/>
    <!-- torso -->
    <rect x="102" y="160" width="96" height="132" rx="28" fill="${ch.skin}" stroke="#2b2140" stroke-width="7"/>
    <!-- outfit -->
    <g>${outfitSVG(outfit)}</g>
    <!-- head -->
    <circle cx="150" cy="100" r="52" fill="${ch.skin}" stroke="#2b2140" stroke-width="8"/>
    <circle cx="132" cy="98" r="6.5" fill="#2b2140"/>
    <circle cx="168" cy="98" r="6.5" fill="#2b2140"/>
    <path d="M136 120 q14 12 28 0" fill="none" stroke="#2b2140" stroke-width="6" stroke-linecap="round"/>
    <circle cx="118" cy="114" r="7" fill="#ffb3c1" opacity=".8"/>
    <circle cx="182" cy="114" r="7" fill="#ffb3c1" opacity=".8"/>
    ${hairSVG(ch)}
  </svg>`;
}

function thumbSVG(o){
  const c = o.c1, b = o.c2;
  if(o.kind==="dress") return `
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M34 14 h32 l4 12 l14 56 q2 8 -8 8 h-52 q-10 0 -8 -8 l14 -56 z" fill="${c}" stroke="#2b2140" stroke-width="6" stroke-linejoin="round"/>
      ${o.pat==="dots"?'<circle cx="42" cy="52" r="4.5" fill="#fff"/><circle cx="60" cy="66" r="4.5" fill="#fff"/><circle cx="50" cy="36" r="4.5" fill="#fff"/>':""}
      ${o.pat==="stripes"?'<rect x="26" y="46" width="48" height="7" fill="rgba(255,255,255,.8)"/><rect x="22" y="64" width="56" height="7" fill="rgba(255,255,255,.8)"/>':""}
      ${o.hat?'<text x="78" y="24" font-size="20">'+(o.hat==="cap"?"🧢":"🎀")+'</text>':""}
    </svg>`;
  return `
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M30 12 h40 l16 12 -8 14 -8 -5 v25 q0 6 -6 6 h-28 q-6 0 -6 -6 v-25 l-8 5 -8 -14 z" fill="${c}" stroke="#2b2140" stroke-width="6" stroke-linejoin="round"/>
      ${o.pat==="dots"?'<circle cx="43" cy="38" r="4" fill="#fff"/><circle cx="58" cy="50" r="4" fill="#fff"/>':""}
      ${o.pat==="stripes"?'<rect x="34" y="36" width="32" height="6" fill="rgba(255,255,255,.8)"/><rect x="34" y="50" width="32" height="6" fill="rgba(255,255,255,.8)"/>':""}
      <path d="M36 70 h28 q6 0 6 6 v10 q0 6 -6 6 h-6 l-8 -8 -8 8 h-6 q-6 0 -6 -6 v-10 q0 -6 6 -6 z" fill="${b}" stroke="#2b2140" stroke-width="5"/>
      ${o.hat?'<text x="76" y="26" font-size="20">'+(o.hat==="cap"?"🧢":"🎀")+'</text>':""}
    </svg>`;
}

/* ================= rendering ================= */
const pool = () => THEMES[CFG.theme];
const cur  = () => pool()[S.idx % pool().length];

function renderChar(animate=true){
  charSVG.innerHTML = characterSVG(CHARS[CFG.who], cur());
  if(animate){
    charSVG.classList.remove("pose"); void charSVG.offsetWidth; charSVG.classList.add("pose");
    const r = charCell.getBoundingClientRect();
    fx("✨", r.left + r.width*0.28, r.top + r.height*0.3);
    fx("✨", r.left + r.width*0.68, r.top + r.height*0.5);
  }
}
function fx(emoji,x,y){
  const e=document.createElement("div"); e.className="burst"; e.textContent=emoji;
  e.style.left=x+"px"; e.style.top=y+"px"; stage.appendChild(e);
  setTimeout(()=>e.remove(),750);
}

function layout(){
  const pad = 12, top = 78;
  const W = innerWidth, H = innerHeight;
  arrowL.classList.add("hidden"); arrowR.classList.add("hidden");
  okBtn.classList.add("hidden"); cards.classList.remove("show");
  charCell.classList.remove("confirmable");

  if(S.level===1){
    Object.assign(charCell.style,{left:"50%",top:top+"px",width:"auto",height:(H-top-24)+"px",transform:"translateX(-50%)"});
  }
  if(S.level===2){
    charCell.classList.add("confirmable");
    Object.assign(charCell.style,{left:pad+"px",top:top+"px",width:(W*0.58-pad*2)+"px",height:(H-top-pad)+"px",transform:"none"});
    Object.assign(arrowR.style,{left:(W*0.60)+"px",top:top+"px",width:(W*0.40-pad)+"px",height:(H-top-pad)+"px"});
    arrowR.classList.remove("hidden");
  }
  if(S.level===4){
    const aw = Math.min(180, W*0.2);
    Object.assign(arrowL.style,{left:pad+"px",top:top+"px",width:aw+"px",height:(H-top-pad)+"px"});
    Object.assign(arrowR.style,{left:(W-aw-pad)+"px",top:top+"px",width:aw+"px",height:(H-top-pad)+"px"});
    Object.assign(charCell.style,{left:"50%",top:top+"px",width:"auto",height:(H-top-24)+"px",transform:"translateX(-50%)"});
    const os = 150;
    Object.assign(okBtn.style,{left:(W-aw-pad*2-os)+"px",top:(H-os-pad)+"px",width:os+"px",height:os+"px"});
    arrowL.classList.remove("hidden"); arrowR.classList.remove("hidden"); okBtn.classList.remove("hidden");
  }
  if(S.level===6){
    const ch = Math.round(170*THUMB[CFG.thumbSize]);
    Object.assign(charCell.style,{left:"50%",top:top+"px",width:"auto",height:(H-top-ch-40)+"px",transform:"translateX(-50%)"});
    const os = 130;
    Object.assign(okBtn.style,{left:(W-os-pad)+"px",top:top+"px",width:os+"px",height:os+"px"});
    okBtn.classList.remove("hidden");
    cards.classList.add("show");
    renderCards();
  }
}
function renderCards(){
  cards.innerHTML = "";
  const p = pool();
  const picks = [0,1,2].map(i => (S.offset+i) % p.length);
  picks.forEach(pi=>{
    const el = document.createElement("div");
    el.className = "ocard" + (pi===S.idx%p.length ? " sel":"");
    el.innerHTML = thumbSVG(p[pi]);
    el.addEventListener("pointerdown", ev=>{
      ev.stopPropagation(); ac();
      S.idx = pi; sSwap(); renderChar();
      renderCards();
    });
    cards.appendChild(el);
  });
}

const BANNERS = {
  1:"點選<b>畫面</b>換衣服，換好了給<b>老師</b>看 👀",
  2:"點<b>箭頭 ▶</b> 換衣服，喜歡就<b>按角色</b>確認 ✓",
  4:"點<b>◀ ▶</b> 換衣服，喜歡就按角落的 <b>✓</b>",
  6:"從下面<b>直接選</b>一套衣服，再按右上的 <b>✓</b>",
};

function startGame(level){
  S.level = level; S.running = true;
  S.idx = Math.floor(Math.random()*pool().length);
  S.offset = 0;
  $("#lvlBadge").textContent = level+"格";
  $("#homeOverlay").classList.add("hidden");
  $("#winOverlay").classList.add("hidden");
  $("#bg").className = CFG.bg;
  document.documentElement.style.setProperty("--arrow-fs", ARROW[CFG.arrowSize]);
  document.documentElement.style.setProperty("--thumb-scale", THUMB[CFG.thumbSize]);
  banner.innerHTML = BANNERS[level];
  layout(); renderChar(false);
}

/* ================= interactions ================= */
function swap(dir){
  if(!S.running) return; ac();
  const n = pool().length;
  S.idx = (S.idx + dir + n) % n;
  sSwap(); renderChar();
  if(S.level===6) renderCards();
}
function confirmPick(){
  if(!S.running) return; ac();
  S.running = false;
  sWin();
  const r = charCell.getBoundingClientRect();
  for(let i=0;i<9;i++){
    setTimeout(()=>{
      const e=document.createElement("div"); e.className="sparkle";
      e.textContent=["✨","🌟","💖"][i%3];
      e.style.left=(r.left+Math.random()*r.width)+"px";
      e.style.top=(r.top+Math.random()*r.height)+"px";
      stage.appendChild(e); setTimeout(()=>e.remove(),1200);
    }, i*110);
  }
  banner.innerHTML = "🎉 <b>選好了！</b>";
  setTimeout(()=>{
    $("#winChar").innerHTML = characterSVG(CHARS[CFG.who], cur(), 220);
    $("#winOverlay").classList.remove("hidden");
  }, 1200);
}

stage.addEventListener("pointerdown", ()=>{
  if(!S.running) return;
  if(S.level===1) swap(+1);
});
charCell.addEventListener("pointerdown", ev=>{
  if(!S.running) return;
  if(S.level===2){ ev.stopPropagation(); confirmPick(); }
  /* level 1 taps fall through to stage handler */
});
arrowL.addEventListener("pointerdown", ev=>{ ev.stopPropagation(); swap(-1); });
arrowR.addEventListener("pointerdown", ev=>{ ev.stopPropagation(); swap(+1); });
okBtn.addEventListener("pointerdown", ev=>{ ev.stopPropagation(); confirmPick(); });
document.addEventListener("keydown", e=>{
  if(!S.running) return;
  if(e.key==="ArrowLeft") swap(-1);
  if(e.key==="ArrowRight") swap(+1);
  if(e.key==="Enter" && S.level>=2) confirmPick();
});

/* ================= wiring ================= */
$$(".lvlcard").forEach(c=>c.addEventListener("click", ()=>{ ac(); startGame(+c.dataset.lvl); }));
$("#btnAgain").addEventListener("click", ()=>{
  S.offset = (S.offset+3) % pool().length; // rotate choices for 6格
  startGame(S.level);
});
$("#btnPick").addEventListener("click", ()=>{ $("#winOverlay").classList.add("hidden"); $("#homeOverlay").classList.remove("hidden"); });
$("#btnHome").addEventListener("click", ()=>{ S.running=false; $("#homeOverlay").classList.remove("hidden"); });
$("#btnSound").addEventListener("click", e=>{ S.sound=!S.sound; e.currentTarget.textContent=S.sound?"🔊":"🔇"; });

const settingsOverlay = $("#settingsOverlay");
function syncSettingsUI(){ $$(".chip").forEach(ch=>ch.classList.toggle("sel", CFG[ch.dataset.set]===ch.dataset.val)); }
$$(".chip").forEach(ch=>ch.addEventListener("click", ()=>{ CFG[ch.dataset.set]=ch.dataset.val; syncSettingsUI(); }));
function openSettings(){ syncSettingsUI(); settingsOverlay.classList.remove("hidden"); }
$("#btnSettings").addEventListener("click", openSettings);
$("#homeSettings").addEventListener("click", openSettings);
$("#btnCloseSettings").addEventListener("click", ()=>settingsOverlay.classList.add("hidden"));
$("#btnApply").addEventListener("click", ()=>{
  settingsOverlay.classList.add("hidden");
  $("#bg").className = CFG.bg;
  if(S.level) startGame(S.level);
});

window.addEventListener("resize", ()=>{ if(S.level) layout(); });
</script>
</body>
</html>
