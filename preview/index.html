<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>目目眼動遊戲收藏</title>
<meta name="description" content="目目非營利整理的眼動遊戲：依學習目標分類，每款保留所有版本，可以直接在站內玩。">
<link rel="icon" href="assets/brand/muve-mark.png">
<link rel="expect" href="#render-ready" blocking="render">
<script>(function(h){if(!("PageRevealEvent" in window))h.classList.add("no-vt");addEventListener("pagereveal",function(e){if(e.viewTransition)h.classList.add("vt-arrive")})})(document.documentElement)</script>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body class="page-catalog">
<header class="hero">
  <div class="hero-sky" aria-hidden="true">
    <span class="planet"></span>
    <span class="moon"></span>
    <span class="dot dot-aqua"></span>
    <span class="dot dot-yellow"></span>
    <img class="hero-char" src="assets/brand/amu-with-guoguo.png" alt="">
  </div>
  <div class="hero-top">
    <img class="logo" src="assets/brand/muve-logo-horizontal.png" alt="目目非營利 MUVE NPO">
    <div id="dwellSlot"></div>
  </div>
  <div class="hero-text">
    <h1>目目眼動遊戲收藏</h1>
    <p class="sub">用眼睛就能玩的小遊戲。先選學習目標，再挑一款開始玩；每款遊戲的舊版本都留著。</p>
  </div>
</header>

<section class="filters" aria-label="篩選遊戲">
  <h2 class="sr-only">學習目標</h2>
  <div class="tiles" id="cats"></div>
  <details class="more" id="more">
    <summary class="btn btn-soft">更多篩選：操作方式、難度</summary>
    <div class="more-body">
      <div class="chip-row"><span class="label">操作方式</span><span id="inputs" class="chips"></span></div>
      <div class="chip-row"><span class="label">難度</span><span id="diffs" class="chips"></span></div>
    </div>
  </details>
</section>

<p class="result-line" id="resultLine" aria-live="polite"></p>
<main class="grid" id="grid"></main>

<footer class="site-foot">
  <div class="foot-text">
    <p>開啟右上角「凝視選取」後，視線停在卡片或按鈕上約 1.2 秒就會自動選取。遊戲裡的設定請在遊戲畫面中調整。</p>
    <p class="fine">遊戲來源：Self-made-mini-game、muve-education（GitHub）、muvenpo-game 與 accessible-game-site（Netlify）。</p>
  </div>
  <img class="wordmark" src="assets/brand/muve-wordmark-dark.png" alt="目目非營利 MUVE NPO">
</footer>
<script src="assets/js/app.js"></script>
<script>MuveApp.init("catalog")</script>
<span id="render-ready" hidden></span>
</body>
</html>
