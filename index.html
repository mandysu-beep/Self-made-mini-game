<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>目目眼動遊戲收藏</title>
<meta name="description" content="目目非營利整理的眼動遊戲：依學習目標分類，每款保留所有版本，可以直接在站內玩。">
<link rel="icon" href="assets/brand/muve-mark.png">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<header class="hero">
  <span class="deco-amber" aria-hidden="true"></span>
  <span class="deco-blush" aria-hidden="true"></span>
  <img class="char" src="assets/brand/guoguo-eye-gaze.png" alt="" aria-hidden="true">
  <div class="toolbar" id="dwellSlot"></div>
  <img class="mark" src="assets/brand/muve-mark.png" alt="目目非營利">
  <div class="text">
    <p class="eyebrow">目目非營利 MUVE NPO・眼動教材</p>
    <h1>目目眼動遊戲收藏</h1>
    <p class="sub">依學習目標找遊戲，每一款都保留舊版本，點「開始玩」就能在這裡直接玩。</p>
  </div>
</header>

<section class="filters" aria-label="篩選">
  <h2>學習目標</h2>
  <div class="cat-grid" id="cats"></div>
  <div class="tag-rows">
    <div class="tag-row"><span class="label">操作方式</span><span id="inputs" class="tag-row"></span></div>
    <div class="tag-row"><span class="label">難度</span><span id="diffs" class="tag-row"></span></div>
  </div>
</section>
<p class="result-line" id="resultLine" aria-live="polite"></p>
<main class="grid" id="grid"></main>

<footer>
  <p>開啟右上角「凝視選取」後，視線停在按鈕上約 1.2 秒就會自動按下。遊戲裡的設定請在遊戲畫面中調整。</p>
  <p>資料來源：mandysu-beep/Self-made-mini-game、muve-education（GitHub）、muvenpo-game 與 accessible-game-site（Netlify）。</p>
  <img class="wordmark" src="assets/brand/muve-wordmark-dark.png" alt="目目非營利 MUVE NPO">
</footer>
<script src="assets/js/app.js"></script>
<script>MuveApp.init("catalog")</script>
</body>
</html>
